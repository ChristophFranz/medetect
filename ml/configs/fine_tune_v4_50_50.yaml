schema_version: 1
seed: 42
maximum_edge: 640

# The extra half of the training dataset is already transformed on disk.
# Turning off loader-time augmentation keeps each epoch exactly 50% original
# and 50% augmented instead of augmenting both groups again.
augmentation: none
selection_split: valid
test_access_during_training: prohibited
optimizer: adamw
weight_decay: 0.0001
max_epochs: 20
early_stopping:
  metric: validation_loss
  mode: min
  patience: 5
  minimum_delta: 0.0001
models:
  detr_detection:
    learning_rate: 0.000003
    batch_size: 2
    trainable_scope: all
  detr_segmentation:
    learning_rate: 0.000003
    batch_size: 1
    validation_batch_size: 1
    gradient_accumulation_steps: 2
    trainable_scope: all
    # Reduces unified-memory pressure on the Mac while still fine-tuning every
    # layer. Computation is repeated during backward passes, so it is slower.
    activation_checkpointing: true
  mask_rcnn:
    learning_rate: 0.00003
    batch_size: 2
    trainable_scope: all
    batching: ensure_positive_per_batch
threshold_selection:
  score_grid:
    start: 0.05
    stop: 0.95
    step: 0.05
  minimum_mask_area_grid: [1, 16, 64, 256, 1024]
  objective: balanced_accuracy
  minimum_sensitivity: 0.90
  tie_breakers: [specificity, f1, higher_score_threshold]
bootstrap:
  resamples: 2000
  confidence_level: 0.95

