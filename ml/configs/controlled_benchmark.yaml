schema_version: 1
seed: 42
maximum_edge: 640
augmentation: none
selection_split: valid
test_access_during_training: prohibited
optimizer: adamw
weight_decay: 0.0001
max_epochs: 30
early_stopping:
  metric: validation_loss
  mode: min
  patience: 5
  minimum_delta: 0.0001
models:
  detr_detection:
    learning_rate: 0.00001
    batch_size: 2
  detr_segmentation:
    learning_rate: 0.00001
    batch_size: 2
  mask_rcnn:
    learning_rate: 0.0001
    batch_size: 2
threshold_selection:
  score_grid:
    start: 0.05
    stop: 0.95
    step: 0.05
  minimum_mask_area_grid: [1, 16, 64, 256, 1024]
  objective: image_level_f1
  tie_breakers: [sensitivity, specificity, higher_score_threshold]
bootstrap:
  resamples: 2000
  confidence_level: 0.95
